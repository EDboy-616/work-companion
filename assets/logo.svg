<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="wc-title">
  <title id="wc-title">Work Companion</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252E42"/>
      <stop offset="1" stop-color="#10141D"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#EDE7D7"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43E3AC"/>
      <stop offset="1" stop-color="#12A97B"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#46536E" stroke-opacity="0.45" stroke-width="4"/>

  <!-- bookmark: the thing that is kept -->
  <path d="M166 190C166 158 187 140 218 140H294C325 140 346 158 346 190V378L256 322L166 378Z" fill="url(#paper)"/>

  <!-- check: recorded / done -->
  <path d="M209 250L243 284L303 217" fill="none" stroke="url(#mint)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- amber dot: the one item that is due -->
  <circle cx="392" cy="122" r="21" fill="#F2AB3C"/>
</svg>
